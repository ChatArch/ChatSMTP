name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - name: Verify installed CLI contract
        run: |
          chatsmtp --version
          chatsmtp --tree
          chatsmtp --tree-brief
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel CLI contract
        run: |
          python -m venv "$RUNNER_TEMP/chatsmtp-wheel"
          "$RUNNER_TEMP/chatsmtp-wheel/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/chatsmtp-wheel/bin/chatsmtp" --version
            "$RUNNER_TEMP/chatsmtp-wheel/bin/chatsmtp" --tree
            "$RUNNER_TEMP/chatsmtp-wheel/bin/chatsmtp" --tree-brief
          )
      - run: mkdocs build --strict
