site_name: ChatSMTP 文档
site_description: ChatArch SMTP tooling package
site_url: https://arch.gh.wzhecnu.cn/ChatSMTP/
repo_url: https://github.com/ChatArch/ChatSMTP
repo_name: ChatArch/ChatSMTP
edit_uri: edit/main/docs/
docs_dir: docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatSMTP 文档
        - locale: en
          name: English
          build: true
          site_name: ChatSMTP Documentation
          nav_translations:
            首页: Home
            CLI 树: CLI Tree
            Python 接口树: Python Interface Tree
            能力边界: Capability Boundary

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  alternate:
    - name: 中文
      link: /ChatSMTP/
      lang: zh
    - name: English
      link: /ChatSMTP/en/
      lang: en

nav:
  - 首页: index.md
  - CLI 树: cli-tree.md
  - Python 接口树: interface-tree.md
  - 能力边界: development-plan.md
